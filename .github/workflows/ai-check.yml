name: AI speed check
# Diagnostic: times each model/setting on a text and an image request; results go to build-logs/ai-speed.txt.
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          KEY=$(grep -o 'apiKey: "[^"]*"' src/config.ts | cut -d'"' -f2)
          PROJ=$(grep -o 'projectId: "[^"]*"' src/config.ts | cut -d'"' -f2)
          IMG=$(base64 -w0 tests/fixtures/school-notice.jpg)
          PROMPT='Extract parent to-dos from this school letter. Return ONLY JSON {"tasks":[{"title":"","date":"","time":""}]}. Today is 2026-10-13.'
          run() { # model label genconfig withimage
            if [ "$4" = "img" ]; then PARTS="[{\"text\":$(jq -Rn --arg p "$PROMPT" '$p')},{\"inlineData\":{\"mimeType\":\"image/jpeg\",\"data\":\"$IMG\"}}]"; else PARTS="[{\"text\":$(jq -Rn --arg p "$PROMPT הורים יקרים, ביום רביעי סיור, אסיפה ביום ראשון 18:30" '$p')}]"; fi
            echo "{\"contents\":[{\"role\":\"user\",\"parts\":$PARTS}],\"generationConfig\":$3}" > /tmp/body.json
            OUT=$(curl -s -m 90 -o /tmp/resp.json -w "%{http_code} %{time_total}" -X POST "https://firebasevertexai.googleapis.com/v1beta/projects/$PROJ/models/$1:generateContent" -H "Content-Type: application/json" -H "x-goog-api-key: $KEY" --data @/tmp/body.json)
            echo "$1 | $2 | $4 | $OUT | $(jq -c '.usageMetadata // .error.message' /tmp/resp.json | head -c 200)" >> /tmp/out.txt
          }
          J='{"responseMimeType":"application/json"}'
          T0='{"responseMimeType":"application/json","thinkingConfig":{"thinkingBudget":0}}'
          TM='{"responseMimeType":"application/json","thinkingConfig":{"thinkingLevel":"minimal"}}'
          TL='{"responseMimeType":"application/json","thinkingConfig":{"thinkingLevel":"low"}}'
          for M in gemini-flash-lite-latest gemini-3.8-flash; do
            run $M default "$J" txt
            run $M budget0 "$T0" txt
            run $M minimal "$TM" txt
            run $M low "$TL" txt
            run $M default "$J" img
            run $M minimal "$TM" img
          done
          git config user.name build-bot && git config user.email build-bot@users.noreply.github.com
          git fetch origin build-logs && git checkout -f build-logs
          cp /tmp/out.txt ai-speed.txt && git add ai-speed.txt && git commit -qm "ai speed" && git push -q origin HEAD:build-logs
