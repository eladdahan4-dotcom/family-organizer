name: Build app

# Every push to main builds:
#  - the Android app (APK) and publishes it as the latest release
#  - the web version (iPhone / computer) on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  BASE_URL: /${{ github.event.repository.name }}
  WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - name: Align Expo package versions
        run: npx expo install --fix -- --legacy-peer-deps
      - name: Type check (report only)
        run: npx tsc --noEmit || true
      - name: Export web
        run: npx expo export -p web --output-dir dist
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --legacy-peer-deps
      - name: Align Expo package versions
        run: npx expo install --fix -- --legacy-peer-deps
      - name: Generate Android project
        run: npx expo prebuild -p android --no-install --clean
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk family-board.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: לוח המשפחה – גרסה ${{ github.run_number }}
          body: |
            להתקנה בטלפון: מורידים את family-board.apk ופותחים אותו.
            קישור קבוע לגרסה האחרונה: https://github.com/${{ github.repository }}/releases/latest/download/family-board.apk
          files: family-board.apk
          make_latest: true
