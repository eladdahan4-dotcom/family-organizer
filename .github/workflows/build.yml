name: Build app

# Every push to main:
#  1. runs all tests (screens, database + security rules, real AI, two-user browser test)
#  2. only if they all pass: builds the Android app (APK, published as the latest release)
#     and the web version (iPhone / computer) on GitHub Pages.
# The test report, AI answers and screenshots are saved to the "build-logs" branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  BASE_URL: /${{ github.event.repository.name }}
  WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
  TZ: Asia/Jerusalem

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Align Expo package versions
        run: npx expo install --fix -- --legacy-peer-deps || echo "align failed, continuing"
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Run all tests
        run: bash scripts/run-tests.sh
      - name: Save report to build-logs branch
        if: always()
        run: |
          cp -r report /tmp/report || mkdir -p /tmp/report
          git config user.name "build-bot" && git config user.email "build-bot@users.noreply.github.com"
          git checkout -f --orphan build-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/report/. .
          echo "run ${{ github.run_number }} / ${{ github.sha }}" > RUN.txt
          git add -A && git commit -qm "test report ${{ github.run_number }}" && git push -qf origin HEAD:build-logs

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx expo install --fix -- --legacy-peer-deps || true
      - name: Export web
        run: npx expo export -p web --output-dir dist
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --legacy-peer-deps
      - run: npx expo install --fix -- --legacy-peer-deps || true
      - name: Generate Android project
        run: npx expo prebuild -p android --no-install --clean
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee /tmp/android.log
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk family-board.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: לוח המשפחה – גרסה ${{ github.run_number }}
          body: |
            כל הבדיקות עברו לפני הבנייה.
            להתקנה בטלפון: מורידים את family-board.apk ופותחים אותו.
            קישור קבוע לגרסה האחרונה: https://github.com/${{ github.repository }}/releases/latest/download/family-board.apk
          files: family-board.apk
          make_latest: true
      - name: Save Android log on failure
        if: failure()
        run: |
          git config user.name "build-bot" && git config user.email "build-bot@users.noreply.github.com"
          git fetch origin build-logs && git checkout -f build-logs
          grep -nE "error|Error|FAILURE|What went wrong" /tmp/android.log | tail -200 > android-errors.log || true
          tail -c 200000 /tmp/android.log > android.log || true
          git add android.log android-errors.log && git commit -qm "android log" && git push -q origin HEAD:build-logs
